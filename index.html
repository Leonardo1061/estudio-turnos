<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - Estudio</title>
    <style>
        :root {
            --primary: #4CAF50;
            --primary-hover: #45a049;
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-main: #333333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 380px;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            text-align: center;
        }

        .login-container h2 {
            color: var(--text-main);
            margin-bottom: 30px;
            font-size: 1.6rem;
            letter-spacing: 0.5px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            font-weight: bold;
            color: #555;
        }

        .input-group select, .input-group input {
            width: 100%;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
            background-color: #fafafa;
        }

        .input-group select:focus, .input-group input:focus {
            border-color: var(--primary);
            background-color: #fff;
        }

        .input-group select:disabled {
            background-color: #e9ECEf;
            color: #6c757d;
            cursor: not-allowed;
        }

        .btn-submit {
            width: 100%;
            padding: 15px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            margin-top: 10px;
        }

        .btn-submit:active {
            transform: scale(0.98);
        }

        .btn-submit:disabled {
            background-color: #9e9e9e;
            cursor: not-allowed;
            transform: none;
        }

        .error-message {
            color: #d32f2f;
            background-color: #ffebee;
            padding: 10px;
            border-radius: 6px;
            font-size: 0.9rem;
            margin-top: 20px;
            display: none;
        }
        
        .info-loader {
            font-size: 0.85rem;
            color: #2196F3;
            margin-bottom: 15px;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <h2>🔒 Acceso Modelos</h2>
        
        <p class="info-loader" id="status-text">Cargando base de datos...</p>

        <form id="login-form">
            <!-- Selector de Jornada -->
            <div class="input-group">
                <label for="jornada-select">1. Selecciona tu Jornada</label>
                <select id="jornada-select" required disabled>
                    <option value="" disabled selected>Cargando jornadas...</option>
                    <option value="Todas">Todas (Ver lista completa)</option>
                    <option value="Mañana">Mañana</option>
                    <option value="Tarde">Tarde</option>
                    <option value="Noche">Noche</option>
                    <option value="Satelites">Satélites</option>
                </select>
            </div>

            <!-- Selector de Nombre (Se llena dinámicamente) -->
            <div class="input-group">
                <label for="nombre">2. Tu Nombre</label>
                <select id="nombre" required disabled>
                    <option value="" disabled selected>Primero selecciona una jornada...</option>
                </select>
            </div>
            
            <div class="input-group">
                <label for="password">3. Contraseña</label>
                <input type="password" id="password" placeholder="Ingresa tu clave" required disabled>
            </div>
            
            <button type="submit" class="btn-submit" id="btn-login" disabled>Ingresar</button>
            
            <div class="error-message" id="error-msg"></div>
        </form>
    </div>

    <script>
        const API_URL = "https://api-v03l.onrender.com";
        let listaModelosGlobal = []; // Aquí guardaremos las modelos temporalmente

        // 1. Descargar la lista de modelos al abrir la página
        async function cargarModelos() {
            const statusText = document.getElementById('status-text');
            const selectJornada = document.getElementById('jornada-select');
            
            try {
                const tiempoExacto = new Date().getTime(); // Rompedor de caché
                const respuesta = await fetch(`${API_URL}/api/modelos?t=${tiempoExacto}`, { cache: 'no-store' });
                
                if (respuesta.ok) {
                    const datos = await respuesta.json();
                    listaModelosGlobal = datos.modelos;
                    
                    // Habilitar el selector de jornadas
                    selectJornada.disabled = false;
                    selectJornada.options[0].textContent = "Elige una opción...";
                    statusText.style.display = 'none'; // Ocultar mensaje de carga
                } else {
                    throw new Error("No se pudo cargar la lista");
                }
            } catch (error) {
                console.error("Error:", error);
                statusText.textContent = "Error al conectar con la base de datos.";
                statusText.style.color = "#d32f2f";
            }
        }

        // 2. Filtrar nombres cuando cambian la jornada
        document.getElementById('jornada-select').addEventListener('change', function() {
            const jornadaElegida = this.value;
            const selectNombre = document.getElementById('nombre');
            const inputPassword = document.getElementById('password');
            const btnLogin = document.getElementById('btn-login');
            
            // Limpiar la lista actual
            selectNombre.innerHTML = '<option value="" disabled selected>Selecciona tu nombre...</option>';
            
            // Filtrar el arreglo global
            let modelosFiltradas = [];
            if (jornadaElegida === 'Todas') {
                modelosFiltradas = listaModelosGlobal;
            } else {
                modelosFiltradas = listaModelosGlobal.filter(m => m.jornada === jornadaElegida);
            }

            // Ordenar alfabéticamente para mayor facilidad
            modelosFiltradas.sort((a, b) => a.nombre.localeCompare(b.nombre));

            // Poblar el dropdown de nombres
            if (modelosFiltradas.length > 0) {
                modelosFiltradas.forEach(mod => {
                    const option = document.createElement('option');
                    option.value = mod.nombre;
                    option.textContent = mod.nombre;
                    selectNombre.appendChild(option);
                });
                selectNombre.disabled = false;
                inputPassword.disabled = false;
                btnLogin.disabled = false;
            } else {
                const option = document.createElement('option');
                option.value = "";
                option.textContent = "No hay modelos en esta jornada";
                selectNombre.appendChild(option);
                selectNombre.disabled = true;
                inputPassword.disabled = true;
                btnLogin.disabled = true;
            }
        });

        // 3. Enviar el formulario de Login
        document.getElementById('login-form').addEventListener('submit', async function(event) {
            event.preventDefault();
            
            const nombre = document.getElementById('nombre').value;
            const password = document.getElementById('password').value.trim();
            const btnLogin = document.getElementById('btn-login');
            const errorMsg = document.getElementById('error-msg');

            errorMsg.style.display = 'none';
            btnLogin.disabled = true;
            btnLogin.textContent = "Verificando...";

            try {
                const respuesta = await fetch(`${API_URL}/api/modelos/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        nombre: nombre,
                        password: password
                    })
                });

                const datos = await respuesta.json();

                if (respuesta.ok) {
                    localStorage.setItem('modelo_actual', datos.nombre);
                    localStorage.setItem('jornada_actual', datos.jornada);
                    
                    btnLogin.style.backgroundColor = '#388E3C';
                    btnLogin.textContent = "¡Bienvenida!";
                    
                    setTimeout(() => {
                        window.location.href = "turnos.html";
                    }, 1000);
                } else {
                    errorMsg.textContent = datos.detail || "Error al iniciar sesión.";
                    errorMsg.style.display = 'block';
                    btnLogin.disabled = false;
                    btnLogin.textContent = "Ingresar";
                }
            } catch (error) {
                console.error("Error:", error);
                errorMsg.textContent = "No hay conexión con el servidor.";
                errorMsg.style.display = 'block';
                btnLogin.disabled = false;
                btnLogin.textContent = "Ingresar";
            }
        });

        // Iniciar la descarga de datos al cargar el script
        cargarModelos();
    </script>
</body>
</html>
